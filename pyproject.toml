[build-system]
build-backend = 'uv_build'
requires = [
    'uv_build ~= 0.13'
]

[project]
name = "rtzip"
version = "0.7.5"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "colorama>=0.4.6",
    "cryptography>=50.0.1",
    "niquests>=3.21.0",
    "pycryptodome>=3.23.0",
    "pyppmd>=1.3.1",
    "pyrefly>=1.4.1",
    "pytest>=9.2.0",
    "pyzipper>=0.4.0",
    "rich>=15.0.0",
    "tgcrypto-c-lectr==1.3.2",
]

tgcrypto-c-lectr = [
    "tgcrypto-c-lectr==1.3.2"
]

pycryptodome = [
    "pycryptodome>=3.23.0"
]

[tool.pytest]
testpaths = ['tests']
pythonpath = ['src']

[[tool.uv.index]]
name = 'aliyun'
#default = true
url = "https://mirrors.aliyun.com/pypi/simple"
