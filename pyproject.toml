[build-system]
build-backend = 'uv_build'
requires = [
    'uv_build < 0.13'
]

[project]
name = "rtzip"
version = "0.4.0"
requires-python = ">=3.12"
dependencies = [
    "obstruct==0.5.2",
    "pyaes>=1.6.1",
]

[dependency-groups]
dev = [
    "cryptography>=50.0.1",
    "niquests>=3.21.0",
    "pycryptodome>=3.23.0",
]
